# The main pipeline for dabprojectwe47

resources:
  pipelines:
    dabprojectwe47_etl:
      name: dabprojectwe47_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/dabprojectwe47_etl"

      libraries:
        - glob:
            include: ../src/dabprojectwe47_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
